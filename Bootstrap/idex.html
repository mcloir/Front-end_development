<!DOCTYPE html>
<!-- Define o tipo de documento como HTML5 -->
<html lang="pt-BR">
  <!-- Define o idioma da página como português do Brasil -->
  <head>
    <meta charset="UTF-8" />
    <!-- Define a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Torna a página responsiva em dispositivos móveis -->
    <title>Gerenciador de Tarefas</title>
    <!-- Título exibido na aba do navegador -->

    <!-- Importa o CSS do Bootstrap via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoBvGa3K9m9a1Q9Z9Gq8K1m0l0F8zvZBkk+P1R9WYa1kN9c"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Barra de navegação escura com título -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Meu Gerenciador</a>
        <!-- Nome do site -->
      </div>
    </nav>

    <!-- Container principal com margem superior -->
    <div class="container mt-5">
      <h1 class="text-center mb-4">Gerenciador de Tarefas</h1>
      <!-- Título centralizado -->

      <!-- Card com formulário para adicionar tarefas -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Adicionar Nova Tarefa</h5>
          <!-- Título do card -->

          <!-- Formulário com campo de texto e botão -->
          <form id="formTarefa">
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="novaTarefa"
                placeholder="Digite sua tarefa..."
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">
              Adicionar Tarefa
            </button>
          </form>
        </div>
      </div>

      <!-- Card com lista de tarefas -->
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Minhas Tarefas</h5>
          <ul id="listaTarefas" class="list-group list-group-flush">
            <!-- Lista onde as tarefas serão inseridas dinamicamente -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Modal de confirmação de remoção de tarefa -->
    <div
      class="modal fade"
      id="modalConfirmacao"
      tabindex="-1"
      aria-labelledby="modalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel">Tarefa Removida</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">A tarefa foi removida com sucesso.</div>
        </div>
      </div>
    </div>

    <!-- Importa o JavaScript do Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-q2gykB5W6MLnBGL4m9xHuQnRW7Bduh7S/6xZ8+ZQAoGhwF3Nm7uWxGxh9xud9C/Q"
      crossorigin="anonymous"
    ></script>

    <!-- Importa o script personalizado -->
    <script src="script.js"></script>
  </body>
</html>
